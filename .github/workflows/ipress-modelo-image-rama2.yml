name: IPRESS FastAPI model image - rama2

on:
  push:
    branches:
      - rama2
    paths:
      - 'src/**'
      - 'models/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/ipress-modelo-image-rama2.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama2
        uses: actions/checkout@v4

      - name: Enable Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish FastAPI model container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/gabrielupc/ipress-modelo-rama2:latest
            ghcr.io/gabrielupc/ipress-modelo-rama2:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/GabrielUPC/TF_TP1_MODELO
          cache-from: type=gha
          cache-to: type=gha,mode=max
